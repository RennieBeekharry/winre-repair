# AI Recovery agent configuration template
# Session bootstrap copies configured values to C:\WinRERepair\agent.cfg.

CONTROL_REPO=YOUR_ACCOUNT/YOUR_PRIVATE_CONTROL_REPO
CONTROL_PATH=control/current-command.json
CONTROL_REF=main
LOG_REPO=YOUR_ACCOUNT/YOUR_PRIVATE_CONTROL_REPO

# Before public release, register a first-party AI Recovery GitHub OAuth App
# or GitHub App and place its public client ID here.
OAUTH_CLIENT_ID=YOUR_AI_RECOVERY_OAUTH_CLIENT_ID

POLL_SECONDS=15
