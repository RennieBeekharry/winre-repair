# RescueMeAI agent configuration template
# Session bootstrap copies configured values to the local RescueMeAI runtime.

PRODUCT=RescueMeAI
AUTH_PROVIDER=GITHUB_APP

CONTROL_REPO=YOUR_ACCOUNT/YOUR_PRIVATE_CONTROL_REPO
CONTROL_PATH=control/current-command.json
CONTROL_REF=main
LOG_REPO=YOUR_ACCOUNT/YOUR_PRIVATE_CONTROL_REPO

# Public GitHub App identifiers. These are NOT secrets.
GITHUB_APP_ID=YOUR_GITHUB_APP_ID
GITHUB_APP_CLIENT_ID=YOUR_GITHUB_APP_CLIENT_ID

# Numeric ID of the single private evidence/control repository.
# RescueMeAI includes this in the GitHub App device token exchange to
# restrict the user access token further.
GITHUB_REPOSITORY_ID=YOUR_PRIVATE_REPOSITORY_ID

# Never place a client secret, private key, access token, refresh token,
# password, BitLocker recovery key, or other secret in this public config.

POLL_SECONDS=15
